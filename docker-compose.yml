services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8025:8025"
    env_file:
      - ./backend/.env    # keep secrets here; NOT copied into image
    # DEV hot-reload (comment out in prod):
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8025 --reload
